name: Bank tariff monitor
on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bank-tariff-monitor
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture sources and compare with the checked-in baseline
        run: |
          mkdir -p tariff-monitor
          npm run --silent archive:tariffs > tariff-monitor/current.json
          npm run --silent review:tariffs -- evidence/stc-refresh-2026-11-24.json tariff-monitor/current.json > tariff-monitor/review.json
      - uses: actions/upload-artifact@v6
        with:
          name: tariff-monitor
          path: |
            tariff-monitor/current.json
            tariff-monitor/review.json
          if-no-files-found: error
          retention-days: 30
