name: Verify deployed Money pages
on: [push]
permissions: {}
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the production alias serves the editorial release
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from time import sleep
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.title = ''
                  self.inside = ''
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('title','script','style'): self.inside = tag
                  if tag == 'meta':
                      a = dict(attrs)
                      self.meta[a.get('name')] = a.get('content','')
              def handle_endtag(self, tag):
                  if tag == self.inside: self.inside = ''
              def handle_data(self, data):
                  if self.inside == 'title': self.title += data
                  elif not self.inside: self.text.append(data)
          for path,title,required in [
              ('/en/money','Bank rates and fees in Nepal',['Compare bank rates and fees in Nepal.']),
              ('/en/money/fixed-deposits','Fixed deposit comparison in Nepal',['Compare deposit rates','within the past 31 days']),
          ]:
              url = 'https://the-no-series.vercel.app' + path
              for attempt in range(12):
                  req = Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Money release verification'})
                  with urlopen(req, timeout=15) as resp:
                      assert resp.geturl() == url
                      page = Page()
                      page.feed(resp.read().decode())
                  if title in page.title and all(term in ' '.join(page.text) for term in required): break
                  sleep(5)
              else: raise AssertionError('Old content on ' + url)
              assert 'noindex' in page.meta['robots']
              assert page.meta['description'] and 'Independent fixed deposit and dollar card comparisons' not in page.meta['description']
              print(url, page.title, page.meta['description'], page.meta['robots'], sep=' | ')
          PY
