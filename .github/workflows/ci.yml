name: Verify the production editorial layout
on: [push]
permissions: {}
jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read bilingual production pages and their hosted fonts
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          from html.parser import HTMLParser
          from time import sleep
          base='https://the-no-series.vercel.app'
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags=[]
                  self.text=[]
                  self.ignore=False
              def handle_starttag(self,tag,attrs):
                  self.tags.append((tag,dict(attrs)))
                  if tag in ('style','script'): self.ignore=True
              def handle_endtag(self,tag):
                  if tag in ('style','script'): self.ignore=False
              def handle_data(self,value):
                  if not self.ignore: self.text.append(value)
          for attempt in range(15):
              try:
                  for lang in ('en','ne'):
                      for suffix in ('','/fixed-deposits'):
                          url=base+'/'+lang+'/money'+suffix
                          with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as res:
                              p=Page()
                              p.feed(res.read().decode())
                          assert any(t=='a' and a.get('hreflang')==('ne' if lang=='en' else 'en') for t,a in p.tags)
                          if suffix:
                              assert ('Compare deposit rates' if lang=='en' else 'निक्षेपका ब्याजदर तुलना गर्नुहोस्') in p.text
                              assert any(('31' if lang=='en' else '३१') in v for v in p.text)
                          else:
                              assert any(t=='nav' and 'intent-links' in a.get('class','') for t,a in p.tags)
                              if lang=='en': assert 'Compare bank rates and fees in Nepal.' in p.text
                          print('Verified',url)
                  for family in ('instrument-serif','tiro-devanagari-hindi'):
                      with urlopen(base+'/fonts/'+family+'.woff2') as r: assert r.read(4)==b'wOF2'
                  print('Verified both self-hosted WOFF2 fonts')
                  break
              except Exception:
                  if attempt==14: raise
                  sleep(6)
          PY
