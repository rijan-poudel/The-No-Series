name: Collect editorial webfonts
on: [push]
permissions: {}
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for pair in 'instrument-serif:latin' 'tiro-devanagari-hindi:devanagari'; do
            family=${pair%:*}
            subset=${pair#*:}
            pkg=$(npm pack "@fontsource/$family@5.3.0" --silent)
            tar -xOf "$pkg" "package/files/$family-$subset-400-normal.woff2" | base64 -w0 > "$family.b64"
            echo "$family begin"
            fold -w 512 "$family.b64" 
            echo
            echo "$family end"
          done
