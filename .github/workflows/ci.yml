name: Retrieve pinned calendar package
on: [push]
permissions: {}
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pkg=$(npm pack --ignore-scripts --silent @inicrea/bikram-sambat-core@0.1.3)
          npm view @inicrea/bikram-sambat-core@0.1.3 dist.integrity
          echo CALENDAR_START
          base64 "$pkg"
          echo CALENDAR_END
